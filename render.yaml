services:
  - type: web
    name: agent-co-backend
    runtime: python
    # AUTHORITATIVE, and it overrides the dashboard. A Blueprint sync applies
    # whatever is written here, so a `plan: free` in this file silently
    # downgrades a paid instance every time the blueprint re-syncs -- which is
    # what happened on 2026-08-26 ("Compute plan changed from Starter to Free").
    #
    # Free instances suspend after fifteen idle minutes. Resuming one takes ~32s
    # measured at the edge, and because that is longer than the frontend's
    # health probe will wait, the first visit after any quiet spell renders a
    # "backend is not answering" banner on a backend that is merely asleep.
    #
    # Do not set this back to `free` without also accepting that banner.
    plan: starter
    branch: Deploy-branch
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agent.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ALLOW_CREDENTIALS
        value: "false"
      - key: REQUIRE_WORKSPACE_AUTH
        value: "true"
      - key: EXPOSE_VERBOSE_ERRORS
        value: "false"
      # REQUIRED. Without one of these two, cors_allowed_origins is [] in
      # production and Starlette rejects every browser request with a bare 400
      # and no Access-Control-Allow-Origin — the API looks down rather than
      # misconfigured. Set in the Render dashboard.
      #   CORS_ALLOWED_ORIGINS      = https://<your-app>.vercel.app
      #   CORS_ALLOWED_ORIGIN_REGEX = ^https://<project>.*\.vercel\.app$
      # The regex also covers Vercel preview deployments, whose hostnames
      # change per branch and per commit.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_REGEX
        sync: false
