services:
  db:
    image: postgres:16-alpine
    container_name: agent_co_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rorak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rorak_secret_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rorak_db}
    ports:
      # Expose only to 127.0.0.1 to avoid public host interface exposure
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rorak} -d ${POSTGRES_DB:-rorak_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - agent-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent_co_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Mode B: Connect to PostgreSQL service name 'db' inside Compose network
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rorak}:${POSTGRES_PASSWORD:-rorak_secret_dev}@db:5432/${POSTGRES_DB:-rorak_db}
      APP_ENV: ${APP_ENV:-development}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production-to-a-secure-random-secret-key}
      REQUIRE_WORKSPACE_AUTH: ${REQUIRE_WORKSPACE_AUTH:-false}
      EXPOSE_VERBOSE_ERRORS: ${EXPOSE_VERBOSE_ERRORS:-true}
    volumes:
      - workspaces_data:/app/workspaces
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn agent.api:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agent-network

volumes:
  postgres_data:
    name: agent_co_postgres_data
  workspaces_data:
    name: agent_co_workspaces_data

networks:
  agent-network:
    name: agent_co_network
    driver: bridge
